spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        # Dialect auto-detected — do not set explicitly for H2

  flyway:
    enabled: false

jwt:
  secret: test-secret-key-that-is-at-least-32-characters-long
  expiration-ms: 3600000

openai:
  api-key: test-key
  model: gpt-4o-mini
  base-url: http://localhost:${wiremock.server.port:8089}
  timeout-seconds: 10
  max-context-messages: 20

logging:
  level:
    com.tdk.aichat: DEBUG
